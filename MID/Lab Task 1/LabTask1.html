<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WTech Lab Task 1</title>
</head>
<body>
    <form>
        <h1>Student Registration Page</h1>
    <label for="StudentName">Student Name:
            <input placeholder="Enter Your Name" type="text" name="studentName">
        </label> <br><br>
    <label for="StudentCGPA">Student CGPA:
            <input placeholder="Enter Your CGPA" type="text" name="studentCGPA">
        </label> <br><br>
        <input type="radio"  name="gender" />
    <label for="male">Male</label>
  <br><br>
    <input type="radio" name="gender" />
    <label for="female">Female</label>
    <br><br>    
    <label for="select">
        Select Your Department:
        <select name="department" id="select">
            <option value="CSE">CSE</option>
            <option value="Architecture">Architecture</option>
            <option value="Civil">Civil</option>
            <option value="Mechanical">Mechanical</option>
            <option value="Electrical">Electrical</option>
            <option value="Software">Software</option>
            <option value="Chemical">Chemical</option>      
        </select>
    </label>
    <br><br>
    <label for="StudentID">Student ID
            <input type="text" name="studentID">
        </label>
    <br><br>
    <label for="text" >Address</label>
    <textarea  rows="5" cols="25" placeholder="Enter your address here"></textarea>
   </form>
   <br><br>
   <label for="month">
        Date of Birth:
        <input type="date" />
    </label>
    <br><br>
    <label for="Email">Email:
            <input placeholder="Enter Your Email" type="text" name="email">
        </label> 
        <br><br>
        <label for="myfile">Upload your grade report:</label>
        <input type="file" id="myfile" name="myfile">
        <br><br>
        <label for="terms"> I agree to the terms and conditions
            <input type="checkbox" name="terms" value="agreed">
        </label>
        <br><br>
        <label for="number">Phone Number:
            <input placeholder="Enter Your Phone Number" type="text" name="phoneNumber">
        </label>
        <br><br>
        <label for="submit">Submit Your Information
            <br>
            <input type="submit" value="Submit">
        </label>
        
    </form>
</body>
</html>
