<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management Page</title>
    <link rel="stylesheet" href="../Design/Style.css">
</head>
<body>

    <div class="container">
        <h1>Product Management</h1>

        <div class="info-box">
            <p><span class="label">Unit Price:</span> 1000 BDT</p>
            <p><span class="label">Duration:</span> 30 Days</p>
        </div>

        <div class="form-group">
            <label for="quantity">Quantity Per Day:</label>
            <input type="number" id="quantity" placeholder="Enter quantity per day" min="0">
            <p id="error-msg" class="error-msg">Quantity cannot be negative!</p>
        </div>

        <div class="form-group">
            <label for="totalPrice">Total Price for 30 Days:</label>
            <input type="text" id="totalPrice" readonly placeholder="0 BDT">
        </div>

        <button onclick="calculatePrice()">Calculate</button>
    </div>

    <script src="../JS/script.js"></script>
</body>
</html>
